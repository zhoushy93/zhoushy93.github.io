<article class="publication"><img src="{{ paper.image | relative_url }}" alt="{{ paper.title }}"><div><h3>{{ paper.title }}</h3><p class="authors">{{ paper.authors }}</p><p><strong>{{ paper.venue }}</strong>{% if paper.note %} · {{ paper.note }}{% endif %}</p><p class="pub-links">{% if paper.paper %}<a href="{{ paper.paper }}">Paper</a>{% endif %}{% if paper.project %}<a href="{{ paper.project }}">Project</a>{% endif %}{% if paper.code %}<a href="{{ paper.code }}">Code</a>{% endif %}</p></div></article>
